# gh-ascii daily profile-card refresh for @unfgws
name: Refresh gh-ascii card

on:
  schedule:
    # Daily at 06:17 UTC (11:47 AM IST).
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/refresh-card.yml"
      - "README.md"

permissions:
  contents: write

concurrency:
  group: refresh-gh-ascii-card
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download both themes
        env:
          HANDLE: unfgws
          GH_ASCII_URL: https://gh.crafter.run
        run: |
          curl -fsSL --retry 3 --retry-delay 5 \
            "$GH_ASCII_URL/$HANDLE?theme=dark" \
            -o dark_mode.svg
          curl -fsSL --retry 3 --retry-delay 5 \
            "$GH_ASCII_URL/$HANDLE?theme=light" \
            -o light_mode.svg

      - name: Save a dated snapshot and commit
        run: |
          # Use India time so archive timestamps match the daily schedule.
          SNAPSHOT_DIR="history/$(TZ=Asia/Kolkata date +'%Y/%m/%d/%H-%M-%S')"
          mkdir -p "$SNAPSHOT_DIR"
          cp dark_mode.svg light_mode.svg "$SNAPSHOT_DIR/"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg "$SNAPSHOT_DIR"
          if git diff --cached --quiet; then
            echo "Card and snapshot unchanged — nothing to commit."
          else
            git commit -m "chore: refresh gh-ascii card and archive snapshot"
            git push
          fi
