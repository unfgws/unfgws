<svg xmlns="http://www.w3.org/2000/svg" width="880" height="390" viewBox="0 0 880 390" role="img" aria-labelledby="title desc">
<title id="title">Experiment 001 — String theory</title>
<desc id="desc">A typographic physics experiment: letters suspended from a curved string, with tension marks and a small diagram-like annotation.</desc>
<defs>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
    <path d="M28 0H0V28" fill="none" stroke="#f3f0e8" stroke-opacity=".055" stroke-width="1"/>
  </pattern>
  <linearGradient id="thread" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ef795b"/>
    <stop offset=".52" stop-color="#e9d28b"/>
    <stop offset="1" stop-color="#8eb9b0"/>
  </linearGradient>
</defs>
<rect width="880" height="390" rx="16" fill="#14161a"/>
<rect width="880" height="390" rx="16" fill="url(#grid)"/>
<path d="M34 34H846" stroke="#f3f0e8" stroke-opacity=".18"/>
<text x="38" y="25" fill="#aaa9a2" font-family="Arial,Helvetica,sans-serif" font-size="10" letter-spacing="2.5">UNFGWS / SMALL EXPERIMENTS</text>
<text x="842" y="25" text-anchor="end" fill="#aaa9a2" font-family="Arial,Helvetica,sans-serif" font-size="10" letter-spacing="2">NO. 001 — 2026</text>
<text x="40" y="104" fill="#f3f0e8" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="600" letter-spacing="-2">STRING</text>
<text x="40" y="151" fill="#f3f0e8" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="600" letter-spacing="-2">THEORY<span fill="#ef795b">.</span></text>
<text x="42" y="181" fill="#aaa9a2" font-family="Arial,Helvetica,sans-serif" font-size="12" letter-spacing="1.4">A STUDY IN TENSION, GRAVITY &amp; SOUND</text>
<path d="M40 209H330" stroke="#f3f0e8" stroke-opacity=".2"/>
<text x="40" y="236" fill="#d4d1c8" font-family="Arial,Helvetica,sans-serif" font-size="12">Pull a little. Let go.</text>
<text x="40" y="255" fill="#d4d1c8" font-family="Arial,Helvetica,sans-serif" font-size="12">See what breaks.</text>
<text x="40" y="333" fill="#8c8e91" font-family="Arial,Helvetica,sans-serif" font-size="10" letter-spacing="1.8">INTERACTIVE TYPE EXPERIMENT</text>
<g transform="translate(356 48)">
  <path d="M25 45 C90 18 138 25 193 58 S302 104 452 47" fill="none" stroke="url(#thread)" stroke-width="2.2"/>
  <path d="M25 45V27M477 47V27" stroke="#f3f0e8" stroke-opacity=".55" stroke-width="1"/>
  <circle cx="25" cy="45" r="4" fill="#ef795b"/>
  <circle cx="477" cy="47" r="4" fill="#8eb9b0"/>
  <g fill="#f3f0e8" font-family="Georgia,serif" font-size="37" text-anchor="middle">
    <text x="65" y="115" transform="rotate(-9 65 115)">S</text>
    <text x="124" y="106" transform="rotate(-4 124 106)">A</text>
    <text x="184" y="112" transform="rotate(5 184 112)">U</text>
    <text x="244" y="135" transform="rotate(12 244 135)">R</text>
    <text x="304" y="145" transform="rotate(15 304 145)">A</text>
    <text x="364" y="129" transform="rotate(7 364 129)">B</text>
    <text x="425" y="104" transform="rotate(-5 425 104)">H</text>
  </g>
  <g stroke="#f3f0e8" stroke-opacity=".32" stroke-dasharray="3 5">
    <path d="M65 77V88M124 76V80M184 83V85M244 97V108M304 111V118M364 96V104M425 73V77"/>
  </g>
  <g fill="#ef795b">
    <circle cx="65" cy="77" r="2.5"/><circle cx="244" cy="97" r="2.5"/><circle cx="304" cy="111" r="2.5"/>
  </g>
  <path d="M68 178H436" stroke="#f3f0e8" stroke-opacity=".18"/>
  <g font-family="Arial,Helvetica,sans-serif" font-size="10" letter-spacing="1.5" fill="#aaa9a2">
    <text x="68" y="199">LOAD</text><text x="252" y="199" text-anchor="middle">ELASTIC LIMIT</text><text x="436" y="199" text-anchor="end">SNAP</text>
  </g>
  <path d="M68 215H436" stroke="#f3f0e8" stroke-opacity=".16"/>
  <path d="M68 215H245" stroke="#ef795b" stroke-width="2"/>
  <path d="M245 215H436" stroke="#8eb9b0" stroke-width="2" stroke-dasharray="3 5"/>
  <g fill="#aaa9a2" font-family="Arial,Helvetica,sans-serif" font-size="10">
    <text x="68" y="244">drag to disturb</text><text x="436" y="244" text-anchor="end">double tap to reset</text>
  </g>
  <path d="M25 278H477" stroke="#f3f0e8" stroke-opacity=".14"/>
  <text x="25" y="303" fill="#aaa9a2" font-family="Arial,Helvetica,sans-serif" font-size="10" letter-spacing="1.2">PHYSICS, BUT MAKE IT PLAY</text>
</g>
<path d="M34 360H846" stroke="#f3f0e8" stroke-opacity=".18"/>
<text x="38" y="379" fill="#8c8e91" font-family="Arial,Helvetica,sans-serif" font-size="9" letter-spacing="1.5">MOVE THE LETTERS / BREAK THE LINE / START AGAIN</text>
<text x="842" y="379" text-anchor="end" fill="#ef795b" font-family="Arial,Helvetica,sans-serif" font-size="10" letter-spacing="1.5">OPEN EXPERIMENT ↗</text>
</svg>